name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify model files
      run: |
        ls -la models/
        echo "✅ Model files present"
    
    - name: Validate model can be loaded
      run: |
        python -c "
import pickle
import sys

try:
    with open('models/iris_model.pkl', 'rb') as f:
        model = pickle.load(f)
    print('✅ Model loaded successfully')
    print(f'Model type: {type(model).__name__}')
except Exception as e:
    print(f'❌ Error loading model: {e}')
    sys.exit(1)
"
    
    - name: Test training script
      run: |
        python train_model.py
    
    - name: Validate Streamlit app syntax
      run: |
        python -m py_compile app.py
        echo "✅ Streamlit app syntax valid"
    
    - name: Verify model performance
      run: |
        python -c "
import pickle
import numpy as np
from sklearn.datasets import load_iris
from sklearn.model_selection import train_test_split
from sklearn.preprocessing import StandardScaler, LabelEncoder

# Load data
iris = load_iris()
X = iris.data
y = iris.target

# Encode
le = LabelEncoder()
y = le.fit_transform(y)

# Scale
scaler = StandardScaler()
X_scaled = scaler.fit_transform(X)

# Split
X_train, X_test, y_train, y_test = train_test_split(X_scaled, y, test_size=0.2, random_state=42, stratify=y)

# Load model
with open('models/iris_model.pkl', 'rb') as f:
    model = pickle.load(f)

# Check accuracy
accuracy = model.score(X_test, y_test)
print(f'Test Accuracy: {accuracy:.4f}')
print('✅ Model performance verified!')
"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Train and save model
      run: |
        python train_model.py
    
    - name: Verify model artifacts
      run: |
        ls -la models/
        echo "✅ Deployment successful!"
